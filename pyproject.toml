[project]
name = "cart"
version = "0.1.0"
description = "FastAPI + SQLModel Shopping Cart API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
managed = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
