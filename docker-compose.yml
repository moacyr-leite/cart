services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cart}
      POSTGRES_DB: ${POSTGRES_DB:-cart}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cart_pgdata:
